[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-ai-computer-use"
version = "0.1.0"
description = "LLM-discovered, deterministic computer-use automation demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.7",
  "playwright>=1.45",
]

[project.optional-dependencies]
llm = ["openai>=1.50"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
computer-use = "app.cli:main"
computer-use-demo = "app.demo:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
